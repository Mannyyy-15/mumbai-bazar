apply plugin: 'com.android.application'

android {
    namespace = "com.mumbaibazar.store"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mumbaibazar.store"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play requires a strictly higher versionCode for every upload, so this
        // must be bumped on each release. versionName is what users see.
        // Override from CI without editing the file:
        //   ./gradlew bundleRelease -PversionCode=7 -PversionName=1.0.6
        versionCode project.hasProperty("versionCode") ? project.versionCode.toInteger() : 1
        versionName project.hasProperty("versionName") ? project.versionName : "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /**
     * Release signing.
     *
     * Play will not accept an unsigned or debug-signed bundle, and there was no
     * signingConfig at all — so `assembleRelease` produced something that could
     * never be uploaded.
     *
     * Credentials come from android/keystore.properties, which is gitignored.
     * If that file is absent the release build still succeeds but stays
     * unsigned, so CI and any developer without the key can still compile.
     * See MOBILE_RELEASE.md for how to generate the keystore.
     */
    signingConfigs {
        release {
            def propsFile = rootProject.file("keystore.properties")
            if (propsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Only attach the signing config when the keystore actually exists;
            // pointing at an absent file fails the build outright.
            if (rootProject.file("keystore.properties").exists()) {
                signingConfig signingConfigs.release
            }

            // R8 shrinking. Capacitor apps are mostly web assets, so the win is
            // modest, but Play bases its download-size warnings on it and there
            // is no reason to ship dead framework code.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
