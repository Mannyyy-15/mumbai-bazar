<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B3131B" />
      <stop offset="100%" stop-color="#7A0A10" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#mbGrad)" stroke="url(#goldBorder)" stroke-width="2.5" />
  <!-- Elegant Serif MB Monogram -->
  <text x="32" y="43" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MB</text>
</svg>
